##############################################################################
#  CineLite - lightweight cinematic shaderpack                               #
#  Tuned for Intel UHD integrated graphics (i5-10310U class laptops)         #
#                                                                            #
#  Core philosophy:                                                          #
#   * NO shadow map pass  -> saves an entire geometry render of the world.   #
#     All "shadows" are faked with wrapped lighting + screen-space           #
#     contact shadows in composite.fsh instead. This is THE big win on       #
#     integrated GPUs.                                                       #
#   * NO ray tracing of any kind - every effect is an analytic or            #
#     few-tap screen-space approximation.                                    #
#   * Only 3 post-processing passes total (composite, composite1, final).    #
##############################################################################

# We implement our own directional shading + vignette
oldLighting=false
vignette=false
underwaterOverlay=false

###############################  GUI layout  ################################

screen=<empty> FAKE_RAY_TRACING SHADOW_QUALITY CONTACT_SHADOWS <empty> WATER_QUALITY REFLECTIONS BLOOM <empty> WIND FOG_QUALITY COLOR_GRADING
sliders=FAKE_RAY_TRACING SHADOW_QUALITY WATER_QUALITY REFLECTIONS BLOOM CONTACT_SHADOWS WIND FOG_QUALITY

###############################  Presets  ###################################
# Defaults inside lib/settings.glsl are identical to MEDIUM.

profile.LOW=FAKE_RAY_TRACING=0 SHADOW_QUALITY=0 WATER_QUALITY=0 REFLECTIONS=1 BLOOM=0 CONTACT_SHADOWS=0 WIND=1 FOG_QUALITY=0 !COLOR_GRADING
profile.MEDIUM=FAKE_RAY_TRACING=2 SHADOW_QUALITY=1 WATER_QUALITY=1 REFLECTIONS=2 BLOOM=1 CONTACT_SHADOWS=1 WIND=1 FOG_QUALITY=1 COLOR_GRADING
profile.HIGH=FAKE_RAY_TRACING=3 SHADOW_QUALITY=2 WATER_QUALITY=2 REFLECTIONS=3 BLOOM=2 CONTACT_SHADOWS=2 WIND=2 FOG_QUALITY=2 COLOR_GRADING

###############################  Buffers  ###################################
# colortex0 : HDR scene colour            (RGBA16F)
# colortex1 : world-space surface normal  (RGB16F)
# colortex2 : r,g = lightmap | b = material id/5 | a = water depth delta/64
# colortex3 : bloom bright-pass           (RGBA8)
# colortex4 : bloom horizontal blur       (RGBA8)
colortex0Format=RGBA16
colortex1Format=RGB16
colortex2Format=RGBA8
colortex3Format=RGBA8
colortex4Format=RGBA8
